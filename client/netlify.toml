# Build settings (base, command, publish) are configured in the Netlify UI.
# Only values that are unambiguous in-file live here.

[build.environment]
  # Netlify's build image defaults to Node 16, but Vite 8 requires
  # ^20.19.0 || >=22.12.0 — without this the build fails with exit code 2.
  NODE_VERSION = "22"

# SPA fallback: deep links like /post/<id> must serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints everything in /assets with a content hash, so a given URL
# can never change meaning. Netlify's default is max-age=0, must-revalidate,
# which costs a round trip per asset on every repeat visit for files that are
# immutable by construction.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must stay uncached — it is what points at the hashed assets, so
# caching it would pin visitors to an old build.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
