name: Keep the API awake

# The API runs on a Render free instance, which spins down after 15 minutes of
# inactivity and then takes ~50 seconds to cold start. That delay lands on a
# real visitor. Pinging /health more often than the idle timeout keeps it warm.
#
# Two things worth knowing before relying on this:
#   * Render's free tier allows 750 instance-hours a month. Staying awake
#     around the clock uses ~730 of them, so a second free service would push
#     the account over.
#   * GitHub disables scheduled workflows after 60 days without repository
#     activity, and cron runs can be delayed under load — an occasional cold
#     start is still possible.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        run: |
          # --max-time covers a cold start; retries cover a transient blip.
          curl --fail --silent --show-error \
               --max-time 90 \
               --retry 3 --retry-delay 10 --retry-all-errors \
               --write-out 'status=%{http_code} time=%{time_total}s\n' \
               --output /dev/null \
               https://tweetmate.onrender.com/health
